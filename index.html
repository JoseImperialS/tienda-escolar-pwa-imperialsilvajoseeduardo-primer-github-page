<!-- Éste es tu primer archivo. Guárdalo y ábrelo con "Open with Live Server". -->
<!doctype html>
<!-- <html lang="es">: le dice al navegador (y a lectores de pantalla) que el idioma es español -->
<html lang="es">

<head>
    <!-- meta charset="utf-8": para que acentos y "ñ" se vean bien -->
    <meta charset="utf-8">
    <!-- meta viewport: hace que la página se vea bien en celulares, no solo en monitor -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- title: lo que aparece en la pestaña del navegador -->
    <title>Mi primera página - PWA de ventas</title>
    <!-- link a nuestra hoja de estilos, en la carpeta css/ -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <!-- header: encabezado de la página -->
    <header>
        <h1>Tienda Escolar</h1>
        <p>Mi primer paso hacia la PWA de ventas</p>
    </header>

    <!-- main: el contenido principal de la página -->
    <main>
        <p>Si ves esta página en tu navegador, tu entorno de desarrollo ya funciona.</p>
        <p>Próximo paso: revisa <code>css/estilos.css</code> para ver cómo se le dio color.</p>
    </main>

    <!-- footer: pie de página -->
    <footer>
        <p>Unidad 1 · Aplicaciones Web Progresivas</p>
    </footer>
</body>

</html>
